<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoastTrack Logo</title>
    <!-- Includi il font di Google e FontAwesome per avere lo stesso identico aspetto dell'app -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffffff; /* Sfondo bianco puro */
            font-family: 'Inter', sans-serif;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            font-size: 80px; /* Dimensione molto grande per ottima risoluzione nello screenshot */
            font-weight: 800;
            color: #212529; /* Colore scuro del testo originale */
            letter-spacing: -1.5px;
        }

        .logo-container i {
            color: #2e8b57; /* Verde originale */
            margin-right: 20px;
            font-size: 90px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <i class="fa-solid fa-person-hiking"></i> CoastTrack
    </div>
</body>
</html>
